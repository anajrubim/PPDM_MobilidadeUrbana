# Mobilidade Urbana — Sprint 1
# Desenvolvimento: `npm run db:up` (só o PostgreSQL, porta 5434 do computador).
# Produção/homologação: `docker compose --profile prod up -d --build` (PostgreSQL + API com HTTPS).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dmr
      POSTGRES_USER: dmr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmr}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # cria o banco dos testes automatizados (dmr_test) na primeira subida
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmr -d dmr"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    profiles: ["prod"]
    build: ./backend
    image: ${API_IMAGE:-mobilidade-urbana-api:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://dmr:${POSTGRES_PASSWORD:-dmr}@db:5432/dmr
      # obrigatório em produção (32+ caracteres, no .env da raiz): a API recusa subir sem ele
      JWT_SECRET: ${JWT_SECRET:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-mobilidade://reset-password}
      SMTP_URL: ${SMTP_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # US13 — HTTPS no próprio Node: certificado montado em /app/certs (use o seu, ex.: Let's Encrypt)
      # A API recebe as conexões direto (sem proxy na frente); com Nginx/Caddy, use TRUST_PROXY=1
      TRUST_PROXY: ${TRUST_PROXY:-0}
      FORCE_HTTPS: "true"
      HTTPS_PORT: "3443"
      HTTPS_PUBLIC_PORT: ${HTTPS_PUBLIC_PORT:-443}
      TLS_CERT_FILE: /app/certs/${TLS_CERT:-dev-cert.pem}
      TLS_KEY_FILE: /app/certs/${TLS_KEY:-dev-key.pem}
    ports:
      - "${HTTP_PORT:-80}:3333"
      - "${HTTPS_PUBLIC_PORT:-443}:3443"
    volumes:
      - ${TLS_DIR:-./backend/certs}:/app/certs:ro

volumes:
  pgdata:
